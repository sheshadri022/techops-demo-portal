kind = "web"
previewPath = "/"
title = "TechOps Demo Portal"
version = "1.0.0"
id = "artifacts/techops-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19017

[services.development]
run = "pnpm --filter @workspace/techops-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/techops-portal", "run", "build" ]
publicDir = "artifacts/techops-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19017"
BASE_PATH = "/"

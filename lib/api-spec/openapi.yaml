openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TechOps Demo IT Asset & Helpdesk Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: assets
    description: IT Asset management
  - name: tickets
    description: Helpdesk ticket management
  - name: employees
    description: Employee management
  - name: dashboard
    description: Dashboard summary & analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── EMPLOYEES ────────────────────────────────────────────
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List all employees
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── ASSETS ────────────────────────────────────────────────
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List all IT assets
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Create a new asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/{id}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get asset by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Delete asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /assets/{id}/assign:
    patch:
      operationId: assignAsset
      tags: [assets]
      summary: Assign or unassign an asset to an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetAssignment"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  # ─── TICKETS ────────────────────────────────────────────────
  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List all helpdesk tickets
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: priority
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create a new helpdesk ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"

  /tickets/{id}:
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Get ticket by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          description: Not found
    patch:
      operationId: updateTicket
      tags: [tickets]
      summary: Update ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
    delete:
      operationId: deleteTicket
      tags: [tickets]
      summary: Delete ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tickets/{id}/close:
    patch:
      operationId: closeTicket
      tags: [tickets]
      summary: Close a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"

  # ─── DASHBOARD ──────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/asset-breakdown:
    get:
      operationId: getAssetBreakdown
      tags: [dashboard]
      summary: Assets grouped by category and status
      responses:
        "200":
          description: Asset breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetBreakdownItem"

  /dashboard/ticket-trend:
    get:
      operationId: getTicketTrend
      tags: [dashboard]
      summary: Ticket counts by day for the last 14 days
      responses:
        "200":
          description: Ticket trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketTrendItem"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent activity feed (tickets + asset events)
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── EMPLOYEE ────────────────────────────────────────────
    Employee:
      type: object
      required: [id, name, email, department, role, createdAt]
      properties:
        id:          { type: integer }
        name:        { type: string }
        email:       { type: string }
        department:  { type: string }
        role:        { type: string }
        phone:       { type: ["string", "null"] }
        avatarUrl:   { type: ["string", "null"] }
        status:      { type: string }
        createdAt:   { type: string }

    EmployeeInput:
      type: object
      required: [name, email, department, role]
      properties:
        name:        { type: string, minLength: 1 }
        email:       { type: string, minLength: 1 }
        department:  { type: string }
        role:        { type: string }
        phone:       { type: string }
        status:      { type: string }

    EmployeeUpdate:
      type: object
      properties:
        name:        { type: string }
        email:       { type: string }
        department:  { type: string }
        role:        { type: string }
        phone:       { type: string }
        status:      { type: string }

    # ─── ASSET ────────────────────────────────────────────────
    Asset:
      type: object
      required: [id, name, category, status, serialNumber, purchaseDate, createdAt]
      properties:
        id:             { type: integer }
        name:           { type: string }
        category:       { type: string }
        brand:          { type: ["string", "null"] }
        model:          { type: ["string", "null"] }
        serialNumber:   { type: string }
        status:         { type: string }
        condition:      { type: ["string", "null"] }
        location:       { type: ["string", "null"] }
        purchaseDate:   { type: string }
        warrantyExpiry: { type: ["string", "null"] }
        purchasePrice:  { type: ["number", "null"] }
        assignedToId:   { type: ["integer", "null"] }
        assignedToName: { type: ["string", "null"] }
        notes:          { type: ["string", "null"] }
        createdAt:      { type: string }

    AssetInput:
      type: object
      required: [name, category, serialNumber, purchaseDate]
      properties:
        name:           { type: string, minLength: 1 }
        category:       { type: string }
        brand:          { type: string }
        model:          { type: string }
        serialNumber:   { type: string }
        status:         { type: string }
        condition:      { type: string }
        location:       { type: string }
        purchaseDate:   { type: string }
        warrantyExpiry: { type: string }
        purchasePrice:  { type: number }
        assignedToId:   { type: integer }
        notes:          { type: string }

    AssetUpdate:
      type: object
      properties:
        name:           { type: string }
        category:       { type: string }
        brand:          { type: string }
        model:          { type: string }
        serialNumber:   { type: string }
        status:         { type: string }
        condition:      { type: string }
        location:       { type: string }
        purchaseDate:   { type: string }
        warrantyExpiry: { type: string }
        purchasePrice:  { type: number }
        notes:          { type: string }

    AssetAssignment:
      type: object
      properties:
        assignedToId: { type: ["integer", "null"] }

    # ─── TICKET ────────────────────────────────────────────────
    Ticket:
      type: object
      required: [id, title, description, status, priority, category, createdAt]
      properties:
        id:           { type: integer }
        title:        { type: string }
        description:  { type: string }
        status:       { type: string }
        priority:     { type: string }
        category:     { type: string }
        assignedToId: { type: ["integer", "null"] }
        assignedToName: { type: ["string", "null"] }
        requesterId:  { type: ["integer", "null"] }
        requesterName: { type: ["string", "null"] }
        relatedAssetId: { type: ["integer", "null"] }
        relatedAssetName: { type: ["string", "null"] }
        resolvedAt:   { type: ["string", "null"] }
        createdAt:    { type: string }
        updatedAt:    { type: string }

    TicketInput:
      type: object
      required: [title, description, category, priority]
      properties:
        title:          { type: string, minLength: 1 }
        description:    { type: string, minLength: 1 }
        category:       { type: string }
        priority:       { type: string }
        assignedToId:   { type: integer }
        requesterId:    { type: integer }
        relatedAssetId: { type: integer }
        status:         { type: string }

    TicketUpdate:
      type: object
      properties:
        title:          { type: string }
        description:    { type: string }
        status:         { type: string }
        priority:       { type: string }
        category:       { type: string }
        assignedToId:   { type: integer }
        relatedAssetId: { type: integer }

    # ─── DASHBOARD ─────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalAssets, assignedAssets, availableAssets, totalTickets, openTickets, resolvedTickets, totalEmployees]
      properties:
        totalAssets:      { type: integer }
        assignedAssets:   { type: integer }
        availableAssets:  { type: integer }
        maintenanceAssets: { type: integer }
        totalTickets:     { type: integer }
        openTickets:      { type: integer }
        inProgressTickets: { type: integer }
        resolvedTickets:  { type: integer }
        urgentTickets:    { type: integer }
        totalEmployees:   { type: integer }

    AssetBreakdownItem:
      type: object
      required: [category, count]
      properties:
        category:  { type: string }
        count:     { type: integer }
        available: { type: integer }
        assigned:  { type: integer }

    TicketTrendItem:
      type: object
      required: [date, open, resolved]
      properties:
        date:     { type: string }
        open:     { type: integer }
        resolved: { type: integer }

    ActivityItem:
      type: object
      required: [id, type, title, description, createdAt]
      properties:
        id:          { type: integer }
        type:        { type: string }
        title:       { type: string }
        description: { type: string }
        createdAt:   { type: string }
        metadata:    { type: ["string", "null"] }
